server:
  port: 8083

spring:
  profiles:
    active: development
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
      show-sql: true
      naming-strategy: org.hibernate.cfg.ImprovedNamingStrategy
      open-in-view: false
      generate-ddl: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/goty
    username: postgres
    password: fence0gras

  jackson:
    time-zone:America/Bogota
    locale:es_COL